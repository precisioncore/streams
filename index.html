<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcam Stream Viewer</title>
  <!-- Load HLS.js for .m3u8 live streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }
    .stream-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }
    .stream-window {
      width: 100%;
      max-width: 400px;
      height: 225px; /* 16:9 aspect ratio */
      margin-bottom: 20px;
      background-color: #000;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    iframe, video, img {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: cover;
    }
    .stream-label {
      position: absolute;
      bottom: 5px;
      left: 5px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 2px 6px;
      font-size: 14px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="stream-container" id="stream-container">
    <!-- Streams will be dynamically added here -->
  </div>

  <script>
    const container = document.getElementById('stream-container');

    // List streams with type: 'iframe', 'mjpeg', or 'hls'
    const streams = [
      { type: 'iframe', url: 'https://www.youtube.com/embed/K1PkxWM6QB4?autoplay=1&mute=1', label: 'Beachhouse Webcam' },
      { type: 'iframe', url: 'https://www.youtube.com/embed/V7sUbjD_e3I?autoplay=1&mute=1', label: 'The Edge Hotel' },
      { type: 'iframe', url: 'https://www.youtube.com/embed/8uHdbMOqSwY?autoplay=1&mute=1', label: 'NY 1963' },
      { type: 'iframe', url: 'http://50.214.237.218/camera/index.html#/video', label: 'Direct Web View' }
    ];

    function renderStreams() {
      streams.forEach((stream, index) => {
        const streamDiv = document.createElement('div');
        streamDiv.className = 'stream-window';

        if (stream.type === 'iframe') {
          streamDiv.innerHTML = `
            <iframe src="${stream.url}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            <div class="stream-label">${stream.label}</div>
          `;
        } else if (stream.type === 'mjpeg') {
          streamDiv.innerHTML = `
            <img src="${stream.url}" alt="${stream.label}">
            <div class="stream-label">${stream.label}</div>
          `;
        } else if (stream.type === 'hls') {
          const video = document.createElement('video');
          video.autoplay = true;
          video.muted = true;
          video.controls = true;

          if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(stream.url);
            hls.attachMedia(video);
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = stream.url;
          }

          const labelDiv = document.createElement('div');
          labelDiv.className = 'stream-label';
          labelDiv.textContent = stream.label;

          streamDiv.appendChild(video);
          streamDiv.appendChild(labelDiv);
        }

        container.appendChild(streamDiv);
      });
    }

    renderStreams();
  </script>
</body>
</html>
